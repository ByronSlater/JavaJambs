<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><title>Fragments — not rendered directly</title></head>
<body>

<!--
  Shared <head> assets: stylesheets + favicon.
  Include this inside every page's <head>, above any page-specific styles.

  Usage:
    <head>
      ...
      <div th:replace="~{fragments/header :: head-assets}"></div>
    </head>
-->
<th:block th:fragment="head-assets">
    <link th:href="@{/css/output.css}" rel="stylesheet" type="text/css" />
    <link th:href="@{/css/themes.css}" rel="stylesheet" type="text/css" />
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/images/favicon-32.png}" />
    <link rel="icon" type="image/png" sizes="192x192" th:href="@{/images/favicon-192.png}" />
    <link rel="apple-touch-icon" sizes="512x512" th:href="@{/images/favicon-512.png}" />
    <script th:src="@{/js/htmx.min.js}" defer></script>
</th:block>

<!--
  Logo block: icon always shown, wordmark appears at sm+, and the
  wordmark swaps to the tagline version at lg+ once there's room.
  Clicking always navigates back to the landing page.

  All three PNGs (icon, text-only, text-with-tagline) get the same
  light backdrop chip, since the dark-green artwork in each needs it
  to stay readable on the dark theme.
-->
<a th:fragment="logo" th:href="@{/dashboard}" class="flex items-center gap-3">
    <div style="background-color: var(--color-logo-bg)" class="rounded-box p-2">
        <img th:src="@{/images/logo-icon.png}" alt="" class="h-16 w-auto object-contain" />
    </div>

    <!-- sm–lg: wordmark only -->
    <div style="background-color: var(--color-logo-bg)" class="hidden sm:flex lg:hidden rounded-box px-2 py-1">
        <img th:src="@{/images/logo-text-only.png}" alt="FitForAll" class="h-8 w-auto object-contain" />
    </div>

    <!-- lg and up: wordmark + tagline -->
    <div style="background-color: var(--color-logo-bg)" class="hidden lg:flex rounded-box px-3 py-2">
        <img th:src="@{/images/logo-text-with-tagline.png}" alt="FitForAll — Functional | Fashionable" class="h-12 w-auto object-contain" />
    </div>
</a>

<!--
  Guest-facing header: logo, "Hello, Guest", Register/Log in.
  Used on the front page and any other public marketing pages.

  Usage:
    <div th:replace="~{fragments/header :: guest-header}"></div>
-->
<header
        th:fragment="guest-header"
        class="flex items-center justify-between px-6 md:px-10 py-4 border-b border-base-300"
>
    <a th:replace="~{fragments/header :: logo}"></a>

    <span class="text-base-content/60 text-sm hidden sm:inline">
    Hello, Guest
  </span>

    <div class="flex items-center gap-3">
        <a th:href="@{/register}"
           class="btn btn-outline btn-sm border-base-content/40 text-base-content hover:bg-base-content hover:text-base-100">
            Register
        </a>
        <a th:href="@{/login}" class="btn btn-neutral btn-sm"> Log in </a>
    </div>
</header>

<!--
  Auth-page header: logo + "Back to Site" link only.
  Used on login/register pages.

  Usage:
    <div th:replace="~{fragments/header :: auth-header}"></div>
-->
<header
        th:fragment="auth-header"
        class="flex items-center justify-between px-6 md:px-10 py-4 border-b border-base-300"
>
    <a th:replace="~{fragments/header :: logo}"></a>

    <a th:href="@{/dashboard}"
       class="btn btn-outline btn-sm border-base-content/40 text-base-content hover:bg-base-content hover:text-base-100">
        Back to Site
    </a>
</header>

</body>
</html>
