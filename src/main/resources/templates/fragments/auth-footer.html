
<th:block th:fragment="footer">
  <!-- sidebar -->
  <nav
          aria-label="Primary"
          class="hidden md:flex md:flex-col md:w-18 md:shrink-0 h-full items-center gap-5 py-10 bg-neutral text-neutral-content overflow-y-auto"
  >
    <a
            th:href="@{/home}"
            aria-current="page"
            class="flex flex-col items-center gap-2 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary rounded-box p-1"
    >
      <span
              class="flex items-center justify-center size-9 rounded-full border-2 border-neutral-content/70 hover:bg-neutral-content/10 transition-colors"
      >
        <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="22"
                height="22"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
        >
          <path d="M3 11.5 12 4l9 7.5"></path>
          <path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"></path>
        </svg>
      </span>
      <span class="text-xs font-medium">Home</span>
    </a>

    <!-- Outfits: clothes hanger -->
    <a
            th:href="@{/outfits}"
            aria-current="page"
            class="flex flex-col items-center gap-2 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary rounded-box p-1"
    >
      <span
              class="flex items-center justify-center size-9 rounded-full border-2 border-neutral-content/70 hover:bg-neutral-content/10 transition-colors"
      >
        <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="22"
                height="22"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
        >
          <path d="M12 10V8.5a2.5 2.5 0 1 0-2.5-2.5"></path>
          <path
                  d="M12 10 3.5 16.2a1.5 1.5 0 0 0 .9 2.8h15.2a1.5 1.5 0 0 0 .9-2.8z"
          ></path>
        </svg>
      </span>
      <span class="text-xs font-medium">Outfits</span>
    </a>

    <!-- Clothes: t-shirt -->
    <a
            th:href="@{/clothes}"
            aria-current="page"
            class="flex flex-col items-center gap-2 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary rounded-box p-1"
    >
      <span
              class="flex items-center justify-center size-9 rounded-full border-2 border-neutral-content/70 hover:bg-neutral-content/10 transition-colors"
      >
        <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="22"
                height="22"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
        >
          <path d="M8 3 3 6l2 4 3-1.5V20h8V8.5L19 10l2-4-5-3a4 4 0 0 1-8 0z"></path>
        </svg>
      </span>
      <span class="text-xs font-medium">Clothes</span>
    </a>

    <!-- Vibe (posts page): sparkles -->
    <a
            th:href="@{/posts}"
            aria-current="page"
            class="flex flex-col items-center gap-2 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary rounded-box p-1"
    >
      <span
              class="flex items-center justify-center size-9 rounded-full border-2 border-neutral-content/70 hover:bg-neutral-content/10 transition-colors"
      >
        <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="22"
                height="22"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
        >
          <path d="M11 3l1.9 5.1L18 10l-5.1 1.9L11 17l-1.9-5.1L4 10l5.1-1.9z"></path>
          <path d="M19 15v4M17 17h4"></path>
          <path d="M5 19v2M4 20h2"></path>
        </svg>
      </span>
      <span class="text-xs font-medium">Vibe</span>
    </a>

    <!-- Spacer pushes the "+" button down to the bottom of the rail -->
    <div class="flex-1" aria-hidden="true"></div>

    <a
            th:href="@{/upload}"
            aria-current="page"
            class="flex items-center justify-center size-9 rounded-full bg-neutral-content text-neutral shadow-md hover:opacity-90 transition-opacity focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
    >
      <span
              class="text-3xl font-semibold leading-none grid place-items-center"
              aria-hidden="true"
      >
        <p>+</p>
      </span>
    </a></nav>

  <!-- mobile pill bottom nav -->
  <nav aria-label="Primary" class="fixed bottom-4 inset-x-4 z-20 md:hidden">
    <div
            class="relative flex items-center justify-around gap-2 px-6 py-3 rounded-full bg-neutral text-neutral-content shadow-lg"
    >
      <a
              th:href="@{/home}"
              aria-current="page"
              class="flex flex-col items-center gap-1 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary rounded-box p-1"

        <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="22"
                height="22"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"

        </svg>
        <span class="text-[11px] font-medium">Home</span>
      </a>

      <!-- Outfits: clothes hanger -->
      <a
              th:href="@{/outfits}"
              aria-current="page"
              class="flex flex-col items-center gap-1 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary rounded-box p-1"
      >
        <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="22"
                height="22"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
        >

          <path
                  d="M12 10 3.5 16.2a1.5 1.5 0 0 0 .9 2.8h15.2a1.5 1.5 0 0 0 .9-2.8z"
          ></path>
        </svg>
        <span class="text-[11px] font-medium">Outfits</span>
      </a>

      <!-- Reserves clearance in the middle for the raised "+" below -->
      <div class="w-14 shrink-0" aria-hidden="true"></div>

      <!-- Clothes: t-shirt -->
      <a
              th:href="@{/clothes}"
              aria-current="page"
              class="flex flex-col items-center gap-1 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary rounded-box p-1"
      >
        <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="22"
                height="22"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
        >
          <path d="M8 3 3 6l2 4 3-1.5V20h8V8.5L19 10l2-4-5-3a4 4 0 0 1-8 0z"></path>
        </svg>
        <span class="text-[11px] font-medium">Clothes</span>
      </a>

      <!-- Vibe (posts page): sparkles -->
      <a
              th:href="@{/posts}"
              aria-current="page"
              class="flex flex-col items-center gap-1 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary rounded-box p-1"
      >
        <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="22"
                height="22"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
        >
          <path d="M11 3l1.9 5.1L18 10l-5.1 1.9L11 17l-1.9-5.1L4 10l5.1-1.9z"></path>
          <path d="M19 15v4M17 17h4"></path>
          <path d="M5 19v2M4 20h2"></path>
        </svg>
        <span class="text-[11px] font-medium">Vibe</span>
      </a>

      <a
              th:href="@{/upload}"
              aria-current="page"
              class="absolute left-1/2 -translate-x-1/2 -top-6 flex items-center justify-center w-14 h-14 rounded-full bg-neutral-content text-neutral shadow-md border-4 border-neutral focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
      >
        <span
                class="text-2xl font-semibold leading-none grid place-items-center"
                aria-hidden="true"
        >
          <p>+</p>
        </span>
      </a>
    </div>
  </nav>
</th:block>
