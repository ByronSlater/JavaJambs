<!--
  Logged-in primary nav, as a reusable "auth footer": a bottom tab bar
  on mobile, a left icon rail on desktop. Same five destinations
  (Home, Closet, Add, Explore, Vibe) in both — only the layout
  changes, driven purely by Tailwind's md: breakpoint, so only one of
  the two <nav> elements is ever actually visible/in the a11y tree at
  once.

  Styled to match the supplied mockups: a dark "neutral" bar/rail with
  outlined circular icon buttons and a plain light "+" button that
  pops forward off it. bg-neutral / neutral-content are used rather
  than literal black/white so this still adapts correctly if the
  site's light/dark theme changes — neutral stays a dark accent and
  neutral-content stays light in both fit-for-all-light and
  fit-for-all-dark (see themes.css), so the contrast holds either way.

  Meant to sit on every authenticated page, alongside auth-header.html.
  Drop it directly inside a flex row next to your <main>, e.g.:

    <div class="flex-1 flex flex-col md:flex-row">
      <div th:replace="~{fragments/auth-footer.html}"></div>
      <main class="flex-1 ...">...</main>
    </div>

  Usage:
    <div th:replace="~{fragments/auth-footer.html}"></div>
  or, since it also declares a named fragment:
    <div th:replace="~{fragments/auth-footer :: footer}"></div>
-->
<th:block th:fragment="footer">
    <!-- Desktop: left icon rail. Stretches to match the content column's
         height since it's a flex sibling of <main> (default align-items:
         stretch), no fixed positioning or viewport-height math needed. -->
    <nav
            aria-label="Primary"
            class="hidden md:flex md:flex-col md:w-24 md:shrink-0 items-center gap-10 py-10 bg-neutral text-neutral-content"
    >
        <a
                th:href="@{/Home}"
                aria-current="page"
                class="flex flex-col items-center gap-2 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary rounded-box p-1"
        >
      <span
              class="flex items-center justify-center w-14 h-14 rounded-full border-2 border-neutral-content/70 hover:bg-neutral-content/10 transition-colors"
      >
        <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="22"
                height="22"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
        >
          <path d="M3 11.5 12 4l9 7.5"></path>
          <path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"></path>
        </svg>
      </span>
            <span class="text-xs font-medium">Home</span>
        </a>

        <a
                href="#"
                class="flex flex-col items-center gap-2 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary rounded-box p-1"
        >
      <span
              class="flex items-center justify-center w-14 h-14 rounded-full border-2 border-neutral-content/70 hover:bg-neutral-content/10 transition-colors"
      >
        <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="22"
                height="22"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
        >
          <rect x="4" y="4" width="16" height="16" rx="2"></rect>
          <path d="M8 9h8M8 12h8M8 15h5"></path>
        </svg>
      </span>
            <span class="text-xs font-medium">Closet</span>
        </a>

        <a
                th:href="@{/explore}"
                class="flex flex-col items-center gap-2 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary rounded-box p-1"
        >
      <span
              class="flex items-center justify-center w-14 h-14 rounded-full border-2 border-neutral-content/70 hover:bg-neutral-content/10 transition-colors"
      >
        <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="22"
                height="22"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
        >
          <circle cx="12" cy="12" r="8"></circle>
          <circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"></circle>
        </svg>
      </span>
            <span class="text-xs font-medium">Explore</span>
        </a>

        <a
                href="#"
                class="flex flex-col items-center gap-2 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary rounded-box p-1"
        >
      <span
              class="flex items-center justify-center w-14 h-14 rounded-full border-2 border-neutral-content/70 hover:bg-neutral-content/10 transition-colors"
      >
        <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="22"
                height="22"
                aria-hidden="true"
                focusable="false"
        >
          <circle
                  cx="12"
                  cy="12"
                  r="8"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
          ></circle>
          <path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor"></path>
        </svg>
      </span>
            <span class="text-xs font-medium">Vibe</span>
        </a>

        <!-- Spacer pushes the "+" button down to the bottom of the rail -->
        <div class="flex-1" aria-hidden="true"></div>

        <a
                href="#"
                aria-label="Add"
                class="flex items-center justify-center w-16 h-16 rounded-full bg-neutral-content text-neutral shadow-md hover:opacity-90 transition-opacity focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
        >
      <span class="text-3xl font-semibold leading-none" aria-hidden="true"
      >+</span
      >
        </a>
    </nav>

    <!-- Mobile: floating pill bottom bar -->
    <nav aria-label="Primary" class="fixed bottom-4 inset-x-4 z-20 md:hidden">
        <div
                class="relative flex items-center justify-between gap-2 px-6 py-3 rounded-full bg-neutral text-neutral-content shadow-lg"
        >
            <a
                    th:href="@{/Home}"
                    aria-current="page"
                    class="flex flex-col items-center gap-1 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary rounded-box p-1"
            >
                <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        width="22"
                        height="22"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                        focusable="false"
                >
                    <path d="M3 11.5 12 4l9 7.5"></path>
                    <path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"></path>
                </svg>
                <span class="text-[11px] font-medium">Home</span>
            </a>

            <a
                    href="#"
                    class="flex flex-col items-center gap-1 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary rounded-box p-1"
            >
                <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        width="22"
                        height="22"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                        focusable="false"
                >
                    <rect x="4" y="4" width="16" height="16" rx="2"></rect>
                    <path d="M8 9h8M8 12h8M8 15h5"></path>
                </svg>
                <span class="text-[11px] font-medium">Closet</span>
            </a>

            <!-- Reserves clearance in the middle for the raised "+" below -->
            <div class="w-14 shrink-0" aria-hidden="true"></div>

            <a
                    th:href="@{/dashboard}"
                    class="flex flex-col items-center gap-1 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary rounded-box p-1"
            >
                <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        width="22"
                        height="22"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                        focusable="false"
                >
                    <circle cx="12" cy="12" r="8"></circle>
                    <circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"></circle>
                </svg>
                <span class="text-[11px] font-medium">Explore</span>
            </a>

            <a
                    href="#"
                    class="flex flex-col items-center gap-1 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary rounded-box p-1"
            >
                <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        width="22"
                        height="22"
                        aria-hidden="true"
                        focusable="false"
                >
                    <circle
                            cx="12"
                            cy="12"
                            r="8"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                    ></circle>
                    <path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor"></path>
                </svg>
                <span class="text-[11px] font-medium">Vibe</span>
            </a>

            <a
                    href="#"
                    aria-label="Add"
                    class="absolute left-1/2 -translate-x-1/2 -top-6 flex items-center justify-center w-14 h-14 rounded-full bg-neutral-content text-neutral shadow-md border-4 border-neutral focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
            >
        <span class="text-2xl font-semibold leading-none" aria-hidden="true"
        >+</span
        >
            </a>
        </div>
    </nav>
</th:block>
