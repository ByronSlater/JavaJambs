<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head.html :: head('Jimp Editor Spike')}"></head>

  <body
    class="min-h-screen"
    hx-boost="true"
    hx-target="#main"
    hx-select="#main"
    hx-swap="outerHTML"
    th:hx-headers='|{"${_csrf.headerName}": "${_csrf.token}"}|'
    th:data-csrf-header="${_csrf.headerName}"
    th:data-csrf-token="${_csrf.token}"
  >
    <div id="main" class="min-h-screen bg-base-100 text-base-content">
      <header th:replace="~{fragments/header.html :: header}"></header>

      <main class="flex justify-center px-6 py-12 md:py-16">
        <div class="w-full max-w-4xl">
          <div class="mb-8">
            <h1 class="text-3xl md:text-4xl font-bold">
              Jimp Background Remover
            </h1>

            <p class="italic opacity-50">
              A little tool to help you isolate your clothing pictures!
            </p>
          </div>

          <div class="card bg-base-100 border border-base-300 shadow-sm">
            <div class="card-body gap-6">
              <div class="flex flex-wrap items-end gap-4">
                <div>
                  <label class="label" for="jimp-file">
                    <span class="label-text">Photo</span>
                  </label>
                  <input
                    id="jimp-file"
                    type="file"
                    accept="image/*"
                    data-jimp-file
                    class="file-input file-input-bordered w-full max-w-xs"
                  />
                </div>

                <div>
                  <span class="label"
                    ><span class="label-text">Tool</span></span
                  >
                  <div class="join">
                    <button
                      type="button"
                      data-jimp-tool="wand"
                      aria-pressed="true"
                      class="btn btn-sm join-item"
                    >
                      Magic Wand
                    </button>
                    <button
                      type="button"
                      data-jimp-tool="brush"
                      aria-pressed="false"
                      class="btn btn-sm join-item"
                    >
                      Brush
                    </button>
                  </div>
                </div>

                <div data-jimp-wand-controls>
                  <label class="label" for="jimp-tolerance">
                    <span class="label-text">
                      Tolerance
                      <span data-jimp-tolerance-value>20</span>
                    </span>
                  </label>
                  <input
                    id="jimp-tolerance"
                    type="range"
                    min="0"
                    max="100"
                    value="20"
                    data-jimp-tolerance
                    class="range range-primary w-48"
                  />
                </div>

                <div data-jimp-brush-controls class="hidden">
                  <label class="label" for="jimp-brush-size">
                    <span class="label-text">
                      Brush size
                      <span data-jimp-brush-size-value>24</span>px
                    </span>
                  </label>
                  <input
                    id="jimp-brush-size"
                    type="range"
                    min="4"
                    max="120"
                    value="24"
                    data-jimp-brush-size
                    class="range range-primary w-48"
                  />
                </div>

                <div class="flex gap-2 ml-auto">
                  <button
                    type="button"
                    data-jimp-undo
                    disabled
                    class="btn btn-ghost btn-sm"
                  >
                    Undo
                  </button>
                  <button
                    type="button"
                    data-jimp-reset
                    disabled
                    class="btn btn-ghost btn-sm"
                  >
                    Reset
                  </button>
                  <button
                    type="button"
                    data-jimp-download
                    disabled
                    class="btn btn-outline btn-sm"
                  >
                    Download
                  </button>
                  <button
                    type="button"
                    data-jimp-save
                    disabled
                    class="btn btn-primary btn-sm"
                  >
                    Save
                  </button>
                </div>
              </div>

              <div
                class="rounded-lg border border-base-300 p-4 overflow-auto flex justify-center"
                style="
                  background-image: linear-gradient(
                      45deg,
                      #cbd5e1 25%,
                      transparent 25%
                    ),
                    linear-gradient(-45deg, #cbd5e1 25%, transparent 25%),
                    linear-gradient(45deg, transparent 75%, #cbd5e1 75%),
                    linear-gradient(-45deg, transparent 75%, #cbd5e1 75%);
                  background-size: 20px 20px;
                  background-position: 0 0, 0 10px, 10px -10px, -10px 0;
                "
              >
                <div class="relative inline-block leading-none">
                  <canvas
                    data-jimp-canvas
                    class="max-w-full cursor-crosshair"
                  ></canvas>
                  <div
                    data-jimp-brush-cursor
                    class="hidden pointer-events-none absolute -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-primary bg-primary/10"
                  ></div>
                </div>
              </div>

              <p data-jimp-status class="text-sm text-base-content/60">
                Upload a photo to get started.
              </p>

              <div>
                <p
                  class="text-xs uppercase tracking-wide text-base-content/50 mb-2"
                >
                  Last saved (via existing /img/upload endpoint)
                </p>
                <div data-jimp-saved-result></div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script type="module">
      import { init } from '/js/jimp-editor.js'

      init(document.body)
    </script>
  </body>
</html>
