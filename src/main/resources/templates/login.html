<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Log in</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link href="themes.css" rel="stylesheet" type="text/css" />
</head>

<body class="min-h-screen">

<div data-theme="fit-for-all-dark" class="bg-base-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="flex items-center justify-between px-6 md:px-10 py-4 border-b border-base-300">
        <a href="/" class="flex items-center gap-2">
            <img src="/images/logo.png" alt="Logo" class="h-44 w-44" />
        </a>
        <a href="#" class="btn btn-outline btn-sm border-base-content/40 text-base-content hover:bg-base-content hover:text-base-100">
            Back to Site
        </a>
    </header>

    <!-- Body -->
    <div class="grid md:grid-cols-2 flex-1">

        <!-- Left: promo panel, stays on the dark theme -->
        <div class="flex flex-col items-center justify-center gap-5 px-10 py-16">
            <button
                    type="button"
                    aria-label="add Home"
                    class="btn btn-circle btn-outline w-20 h-20 border-base-content/40 text-base-content text-4xl hover:bg-base-content hover:text-base-100">

                ⌂

            </button>
            <h2 class="text-2xl font-semibold text-base-content">Welcome back</h2>
            <p class="text-base-content/60 text-center max-w-xs">
                Log in to see your closets, items and outfits right where you left them.
            </p>
        </div>

        <!-- Right: login form, switches to the light theme -->
        <div data-theme="fit-for-all-light" class="bg-base-100">
            <div class="h-full flex flex-col justify-center px-8 py-12 md:px-14 max-w-md mx-auto w-full gap-5">

                <div>
                    <h1 class="text-3xl font-bold text-base-content">Log in</h1>
                </div>

                <form th:action="@{/login}" th:object="${loginForm}" method="post" class="flex flex-col gap-4">

                    <!-- CSRF token - Spring Security not on class path -->
                    <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div th:if="${#fields.hasGlobalErrors()}" role="alert" class="alert alert-error text-sm">
                        <span th:each="err : ${#fields.globalErrors()}" th:text="${err}">Something went wrong.</span>
                    </div>

                    <fieldset class="fieldset flex flex-col gap-1">
                        <label class="label" for="email">Email</label>
                        <input id="email" th:field="*{email}" type="email" placeholder="you@example.com"
                               th:classappend="${#fields.hasErrors('email')} ? 'input-error'"
                               class="input w-full" />
                        <span class="text-error text-xs" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</span>
                    </fieldset>

                    <fieldset class="fieldset flex flex-col gap-1">
                        <label class="label" for="password">Password</label>
                        <input id="password" th:field="*{password}" type="password"
                               th:classappend="${#fields.hasErrors('password')} ? 'input-error'"
                               class="input w-full" />
                        <span class="text-error text-xs" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password error</span>
                    </fieldset>

                    <button type="submit" class="btn btn-neutral w-full">Log in</button>
                </form>

                <div class="divider text-xs text-base-content/50">or continue with</div>

                <div class="grid grid-cols-2 gap-4">
                    <a href="#" class="btn btn-outline w-full">Google</a>
                    <a href="#" class="btn btn-outline w-full">Apple</a>
                </div>

                <p class="text-center text-sm text-base-content/70">
                    New here? <a th:href="@{/register}" class="link link-primary font-medium">Create an account</a>
                </p>

            </div>
        </div>
    </div>
</div>
</body>
</html>
