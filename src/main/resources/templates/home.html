<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{base.html}"
>
  <head>
    <title>Home Page</title>
  </head>

  <body>
    <div layout:fragment="content">
      <th:block sec:authorize="isAuthenticated()">
        <section class="flex flex-col gap-2">
          <span class="badge badge-neutral badge-lg py-4 px-4 w-fit">
            Welcome back 👋
          </span>

          <h1
            class="text-3xl md:text-4xl font-bold"
            th:text="'Hi, ' + ${#authentication.principal.username} + '!'"
          >
            Hi, username!
          </h1>

          <p class="text-base-content/70 max-w-xl">
            Here's a quick look at your wardrobe.
          </p>
        </section>
      </th:block>

      <th:block sec:authorize="!isAuthenticated()">
        <span class="text-5xl" aria-hidden="true">🔒</span>
        <h1 class="text-2xl font-bold">
          This dashboard is for logged-in users
        </h1>
        <p class="text-base-content/70 max-w-sm">
          Log in or create an account to see your wardrobe dashboard.
        </p>
        <div class="flex gap-3">
          <a th:href="@{/login}" class="btn btn-neutral">Log in</a>
          <a th:href="@{/register}" class="btn btn-neutral btn-outline">
            Register
          </a>
        </div>
      </th:block>
    </div>
  </body>
</html>
