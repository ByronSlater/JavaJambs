<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>

    <link rel="stylesheet" th:href="@{/css/output.css}" />
    <script th:src="@{/js/htmx.min.js}" defer></script>
  </head>

  <body
    class="min-h-screen"
    hx-boost="true"
    hx-target="#main"
    hx-select="#main"
    hx-swap="outerHTML"
    th:hx-headers='|{"${_csrf.headerName}": "${_csrf.token}"}|'
  >
    <div
      id="main"
      data-theme="fit-for-all-dark"
      class="bg-base-100 min-h-screen flex flex-col"
    >
      <!-- Header -->
      <header
        class="flex items-center justify-between px-6 md:px-10 py-4 border-b border-base-300"
      >
        <a href="/" class="flex items-center gap-2">
          <img th:src="@{/images/logo.png}" alt="Logo" class="h-44 w-44" />
        </a>
        <a
          th:href="@{/dashboard}"
          class="btn btn-outline btn-sm border-base-content/40 text-base-content hover:bg-base-content hover:text-base-100"
        >
          Back to Site
        </a>
      </header>

      <!-- Body -->
      <div class="grid md:grid-cols-2 flex-1">
        <!-- Left: promo panel atm, stays on the dark theme -->
        <div
          class="flex flex-col items-center justify-center gap-5 px-10 py-16"
        >
          <button
            type="button"
            aria-label="Add item"
            class="btn btn-circle btn-outline w-20 h-20 border-base-content/40 text-base-content text-2xl hover:bg-base-content hover:text-base-100"
          >
            +
          </button>
          <h2 class="text-2xl font-semibold text-base-content">
            Start your wardrobe
          </h2>
          <p class="text-base-content/60 text-center max-w-xs">
            Create closets, put together outfits, that is fit for all.
          </p>
        </div>

        <!-- Right: registration form, switches to the light them -->
        <div data-theme="fit-for-all-light" class="bg-base-100">
          <div
            class="h-full flex flex-col justify-center px-8 py-12 md:px-14 max-w-md mx-auto w-full gap-5"
          >
            <div>
              <h1 class="text-3xl font-bold text-base-content">
                Create Your Account
              </h1>
            </div>
            <form
              th:action="@{/register}"
              th:object="${registerForm}"
              method="post"
              class="flex flex-col gap-4"
            >
              <div
                th:if="${#fields.hasGlobalErrors()}"
                role="alert"
                class="alert alert-error text-sm"
              >
                <span th:each="err : ${#fields.globalErrors()}" th:text="${err}"
                  >Something went wrong.</span
                >
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div class="form-control flex flex-col gap-1 col-span-2">
                  <label class="label-text text-sm" for="username"
                    >Username</label
                  >
                  <input
                    id="username"
                    th:field="*{username}"
                    type="text"
                    th:classappend="${#fields.hasErrors('username')}? 'input-error'"
                    class="input input-bordered w-full"
                  />
                  <span
                    class="text-error text-xs"
                    th:if="${#fields.hasErrors('username')}"
                    th:errors="*{username}"
                    >Username error</span
                  >
                </div>

                <div class="form-control flex flex-col gap-1 col-span-2">
                  <label class="label-text text-sm" for="email">Email</label>
                  <input
                    id="email"
                    th:field="*{email}"
                    type="email"
                    placeholder="you@example.com"
                    th:classappend="${#fields.hasErrors('email')} ? 'input-error'"
                    class="input input-bordered w-full"
                  />
                  <span
                    class="text-error text-xs"
                    th:if="${#fields.hasErrors('email')}"
                    th:errors="*{email}"
                    >Email error</span
                  >
                </div>

                <div class="form-control flex flex-col gap-1 col-span-2">
                  <label class="label-text text-sm" for="password"
                    >Password</label
                  >
                  <input
                    id="password"
                    th:field="*{password}"
                    type="password"
                    th:classappend="${#fields.hasErrors('password')} ? 'input-error'"
                    class="input input-bordered w-full"
                  />
                  <span
                    class="text-error text-xs"
                    th:if="${#fields.hasErrors('password')}"
                    th:errors="*{password}"
                    >Password error</span
                  >
                </div>

                <button type="submit" class="btn btn-neutral w-full col-span-2">
                  Create account
                </button>
              </div>
            </form>

            <div class="divider text-xs text-base-content/50">
              or continue with
            </div>

            <div class="grid grid-cols-2 gap-4">
              <a href="#" class="btn btn-outline w-full">Google</a>
              <a href="#" class="btn btn-outline w-full">Apple</a>
            </div>

            <p class="text-center text-sm text-base-content/70">
              Already registered?
              <a th:href="@{/login}" class="link link-primary font-medium"
                >Log in</a
              >
            </p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
