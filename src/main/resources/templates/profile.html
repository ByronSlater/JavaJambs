<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head.html :: head('Profile')}"></head>

  <body
    class="min-h-screen"
    hx-boost="true"
    hx-target="#main"
    hx-select="#main"
    hx-swap="outerHTML"
    th:hx-headers='|{"${_csrf.headerName}": "${_csrf.token}"}|'
  >
    <div id="main" class="min-h-screen bg-base-100 text-base-content">
      <!-- Header -->
      <header th:replace="~{fragments/header.html :: header}"></header>

      <!-- Profile -->
      <main class="flex justify-center px-6 py-12 md:py-20">
        <div class="w-full max-w-3xl">
          <!-- Page heading -->
          <div class="mb-8">
            <p class="text-sm text-base-content/50">Account</p>

            <h1 class="text-3xl md:text-4xl font-bold">Your Profile</h1>

            <p class="mt-2 text-base-content/60">
              Manage your personal information and account details.
            </p>
          </div>

          <!-- Profile card -->
          <div
            data-theme="fit-for-all-light"
            class="card bg-base-100 border border-base-300 shadow-sm"
          >
            <div class="card-body">
              <!-- Profile header -->
              <div
                class="flex flex-col md:flex-row items-center md:items-start gap-6"
              >
                <!-- Avatar -->
                <div class="avatar">
                  <!-- Uploaded profile picture -->
                  <div
                    th:if="${user.profile_picture != null
                                        and !user.profile_picture.isEmpty()}"
                    class="w-32 h-32 rounded-full ring ring-primary ring-offset-base-100 ring-offset-2"
                  >
                    <img
                      th:src="${user.profile_picture}"
                      th:alt="${user.username + ' profile picture'}"
                    />
                  </div>

                  <!-- Default avatar -->
                  <div
                    th:unless="${user.profile_picture != null
                                            and !user.profile_picture.isEmpty()}"
                    class="w-32 h-32 rounded-full bg-primary text-primary-content flex items-center justify-center text-5xl font-bold ring ring-primary ring-offset-base-100 ring-offset-2"
                  >
                    <span
                      th:text="${#strings.substring(user.username, 0, 1).toUpperCase()}"
                    >
                      U
                    </span>
                  </div>
                </div>

                <!-- Name / bio -->
                <div class="flex-1 text-center md:text-left">
                  <h2 class="text-3xl font-bold" th:text="${user.username}">
                    username
                  </h2>

                  <p class="mt-1 text-base-content/60" th:text="${user.email}">
                    email@example.com
                  </p>

                  <p
                    th:if="${user.bio != null
                                        and !user.bio.isEmpty()}"
                    class="mt-4 text-base-content/80 leading-relaxed"
                    th:text="${user.bio}"
                  >
                    Your bio goes here.
                  </p>

                  <p
                    th:unless="${user.bio != null
                                            and !user.bio.isEmpty()}"
                    class="mt-4 italic text-base-content/40"
                  >
                    No bio added yet.
                  </p>
                </div>
              </div>

              <div class="divider"></div>

              <!-- Account details -->
              <div>
                <h3 class="font-semibold text-lg mb-4">Account Information</h3>

                <div class="grid md:grid-cols-2 gap-4">
                  <!-- Username -->
                  <div class="rounded-lg bg-base-200 p-4">
                    <p
                      class="text-xs uppercase tracking-wide text-base-content/50"
                    >
                      Username
                    </p>

                    <p class="mt-1 font-medium" th:text="${user.username}">
                      username
                    </p>
                  </div>

                  <!-- Email -->
                  <div class="rounded-lg bg-base-200 p-4">
                    <p
                      class="text-xs uppercase tracking-wide text-base-content/50"
                    >
                      Email
                    </p>

                    <p
                      class="mt-1 font-medium break-all"
                      th:text="${user.email}"
                    >
                      email@example.com
                    </p>
                  </div>

                  <!-- Role -->
                  <div class="rounded-lg bg-base-200 p-4">
                    <p
                      class="text-xs uppercase tracking-wide text-base-content/50"
                    >
                      Role
                    </p>

                    <div class="mt-2">
                      <span class="badge badge-primary" th:text="${user.role}">
                        USER
                      </span>
                    </div>
                  </div>

                  <!-- Member since -->
                  <div class="rounded-lg bg-base-200 p-4">
                    <p
                      class="text-xs uppercase tracking-wide text-base-content/50"
                    >
                      Member since
                    </p>

                    <p
                      class="mt-1 font-medium"
                      th:text="${#temporals.format(
                                        user.createdAt,
                                        'dd MMMM yyyy'
                                    )}"
                    >
                      15 September 2026
                    </p>
                  </div>
                </div>
              </div>

              <div class="divider"></div>

              <!-- Actions -->
              <div class="flex flex-col sm:flex-row justify-end gap-3">
                <a th:href="@{/dashboard}" class="btn btn-ghost">
                  Back to Dashboard
                </a>

                <a th:href="@{/profile/edit}" class="btn btn-primary">
                  Edit Profile
                </a>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
